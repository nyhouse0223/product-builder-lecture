<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="광고, 콘텐츠, 기술 제휴 문의를 남길 수 있는 페이지" />
  <meta name="color-scheme" content="dark light" />
  <title>제휴 문의</title>

  <script>
    // 첫 페인트 전에 테마를 결정해 화면 깜빡임을 막는다.
    (function () {
      let storedTheme = null;

      try {
        storedTheme = localStorage.getItem("theme");
      } catch (error) {
        storedTheme = null;
      }

      const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
      document.documentElement.dataset.theme = storedTheme || (prefersLight ? "light" : "dark");
    })();
  </script>

  <style>
    :root {
      --bg-start: #10172a;
      --bg-end: #251447;
      --glow-warm: rgba(255, 209, 102, 0.14);
      --glow-cool: rgba(106, 95, 255, 0.22);
      --card: rgba(255, 255, 255, 0.1);
      --card-border: rgba(255, 255, 255, 0.16);
      --surface-soft: rgba(255, 255, 255, 0.07);
      --border-soft: rgba(255, 255, 255, 0.12);
      --border-strong: rgba(255, 255, 255, 0.16);
      --input-bg: rgba(8, 11, 28, 0.32);
      --input-border: rgba(255, 255, 255, 0.14);
      --text: #ffffff;
      --subtext: #cfd4e4;
      --muted: rgba(255, 255, 255, 0.5);
      --placeholder: rgba(255, 255, 255, 0.4);
      --badge-text: #fff4c8;
      --primary: #ffd166;
      --primary-dark: #f5b942;
      --primary-glow: rgba(245, 185, 66, 0.24);
      --danger: #ff9a9a;
      --danger-bg: rgba(237, 98, 98, 0.14);
      --success: #8fe6b4;
      --success-bg: rgba(72, 167, 106, 0.16);
      --nav-bg: rgba(22, 30, 52, 0.82);
      --strong: #ffffff;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.3);
    }

    :root[data-theme="light"] {
      --bg-start: #f3f6fd;
      --bg-end: #e6e9f8;
      --glow-warm: rgba(255, 193, 61, 0.2);
      --glow-cool: rgba(124, 108, 255, 0.16);
      --card: rgba(255, 255, 255, 0.74);
      --card-border: rgba(23, 32, 62, 0.1);
      --surface-soft: rgba(255, 255, 255, 0.62);
      --border-soft: rgba(23, 32, 62, 0.09);
      --border-strong: rgba(23, 32, 62, 0.13);
      --input-bg: rgba(255, 255, 255, 0.82);
      --input-border: rgba(23, 32, 62, 0.14);
      --text: #16203c;
      --subtext: #4d5878;
      --muted: rgba(22, 32, 60, 0.55);
      --placeholder: rgba(22, 32, 60, 0.4);
      --badge-text: #8a5d00;
      --primary: #ffc93d;
      --primary-dark: #f0a91c;
      --primary-glow: rgba(240, 169, 28, 0.28);
      --danger: #b3352f;
      --danger-bg: rgba(237, 98, 98, 0.13);
      --success: #1c7a48;
      --success-bg: rgba(72, 167, 106, 0.15);
      --nav-bg: rgba(255, 255, 255, 0.86);
      --strong: #16203c;
      --shadow: 0 24px 60px rgba(23, 32, 62, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      /* 상단 여백은 고정 네비게이션 바가 콘텐츠를 가리지 않도록 확보한다. */
      padding: 84px 24px 24px;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, var(--glow-warm), transparent 24%),
        radial-gradient(circle at 85% 80%, var(--glow-cool), transparent 26%),
        linear-gradient(145deg, var(--bg-start), var(--bg-end));
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: color 0.3s ease;
    }

    .container { width: min(100%, 640px); }

    .contact-card {
      padding: clamp(26px, 5vw, 48px);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      color: var(--badge-text);
      background: var(--surface-soft);
      font-size: 0.88rem;
      font-weight: 800;
    }

    .sparkle { color: var(--primary); }

    /* 스크롤과 무관하게 화면 우측 상단에 계속 떠 있는 메뉴 */
    .top-nav {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .nav-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: auto;
      padding: 9px 15px;
      color: var(--subtext);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      background: var(--nav-bg);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.16);
      backdrop-filter: blur(14px);
      font: inherit;
      font-size: 0.84rem;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.18s ease, color 0.18s ease, background 0.3s ease, border-color 0.3s ease;
    }

    .nav-button:hover {
      transform: translateY(-2px);
      color: var(--strong);
    }

    .nav-button:active { transform: translateY(0); }

    .nav-button[aria-current="page"] {
      color: #2e2100;
      border-color: transparent;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 10px 24px var(--primary-glow);
    }

    .nav-button[aria-current="page"]:hover { color: #2e2100; }

    .nav-icon { font-size: 1rem; }

    h1 {
      margin: 0;
      font-size: clamp(1.9rem, 5.5vw, 2.8rem);
      line-height: 1.15;
      letter-spacing: -0.045em;
    }

    .description {
      margin: 14px 0 0;
      color: var(--subtext);
      font-size: 0.97rem;
      line-height: 1.7;
      word-break: keep-all;
    }

    .contact-form {
      display: grid;
      gap: 16px;
      margin-top: 30px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field { display: grid; gap: 7px; }

    label {
      color: var(--subtext);
      font-size: 0.86rem;
      font-weight: 800;
    }

    .required { color: var(--primary); }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 15px;
      color: var(--text);
      border: 1px solid var(--input-border);
      border-radius: 14px;
      background: var(--input-bg);
      font: inherit;
      font-size: 0.95rem;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    input::placeholder,
    textarea::placeholder { color: var(--placeholder); }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    select { cursor: pointer; }
    select option { color: #16203c; background: #ffffff; }

    textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.6;
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.6;
    }

    .consent input {
      width: 17px;
      height: 17px;
      flex: none;
      margin-top: 2px;
      padding: 0;
      accent-color: var(--primary-dark);
      cursor: pointer;
    }

    .consent label { color: inherit; font-size: inherit; font-weight: 600; }

    .honeypot {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .submit-button {
      min-height: 54px;
      margin-top: 4px;
      color: #2e2100;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 15px 30px var(--primary-glow);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .submit-button:hover:not(:disabled) { transform: translateY(-2px); }
    .submit-button:active:not(:disabled) { transform: translateY(0); }

    .submit-button:disabled {
      opacity: 0.55;
      cursor: progress;
      transform: none;
    }

    .status {
      display: none;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.6;
      word-break: keep-all;
    }

    .status.show { display: block; }

    .status.success {
      color: var(--success);
      background: var(--success-bg);
      border: 1px solid var(--success-bg);
    }

    .status.error {
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid var(--danger-bg);
    }

    @media (max-width: 560px) {
      body { padding: 68px 14px 14px; }
      .top-nav {
        top: 11px;
        right: 11px;
        left: 11px;
        gap: 6px;
      }
      .nav-button {
        padding: 7px 12px;
        font-size: 0.78rem;
      }
      /* 좁은 화면에서는 테마 버튼을 아이콘만 남겨 세 개가 한 줄에 들어가게 한다. */
      #themeLabel { display: none; }
      .contact-card { border-radius: 25px; }
      .field-row { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <nav class="top-nav" aria-label="주요 메뉴">
    <a class="nav-button" href="index.html">
      <span class="nav-icon">🍀</span>
      <span>행운의 번호</span>
    </a>

    <a class="nav-button" href="contact.html" aria-current="page">
      <span class="nav-icon">📩</span>
      <span>제휴 문의</span>
    </a>

    <button class="nav-button" id="themeToggle" type="button" aria-pressed="false">
      <span class="nav-icon" id="themeIcon">🌙</span>
      <span id="themeLabel">다크 모드</span>
    </button>
  </nav>

  <main class="container">
    <section class="contact-card">
      <div class="card-header">
        <div class="badge">
          <span class="sparkle">✦</span>
          PARTNERSHIP
        </div>
      </div>

      <h1>제휴 문의</h1>

      <p class="description">
        광고, 콘텐츠, 기술 제휴 등 어떤 제안이든 편하게 남겨주세요.<br />
        영업일 기준 2~3일 안에 입력해주신 이메일로 답변드립니다.
      </p>

      <form class="contact-form" id="contactForm" action="https://formspree.io/f/xwlenpln" method="POST">
        <input type="hidden" name="_subject" value="[제휴 문의] 새로운 문의가 도착했습니다" />
        <input class="honeypot" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" />

        <div class="field-row">
          <div class="field">
            <label for="name">담당자명 <span class="required">*</span></label>
            <input type="text" id="name" name="name" placeholder="홍길동" required autocomplete="name" />
          </div>

          <div class="field">
            <label for="company">회사 / 단체명 <span class="required">*</span></label>
            <input type="text" id="company" name="company" placeholder="주식회사 예시" required autocomplete="organization" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="email">이메일 <span class="required">*</span></label>
            <input type="email" id="email" name="email" placeholder="contact@example.com" required autocomplete="email" />
          </div>

          <div class="field">
            <label for="phone">연락처</label>
            <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" autocomplete="tel" />
          </div>
        </div>

        <div class="field">
          <label for="type">제휴 유형 <span class="required">*</span></label>
          <select id="type" name="제휴 유형" required>
            <option value="">선택해주세요</option>
            <option value="광고 / 배너 제휴">광고 / 배너 제휴</option>
            <option value="콘텐츠 제휴">콘텐츠 제휴</option>
            <option value="API / 기술 제휴">API / 기술 제휴</option>
            <option value="기타">기타</option>
          </select>
        </div>

        <div class="field">
          <label for="message">문의 내용 <span class="required">*</span></label>
          <textarea id="message" name="message" placeholder="제안하시는 내용과 기대하시는 협업 형태를 자유롭게 적어주세요." required></textarea>
        </div>

        <div class="consent">
          <input type="checkbox" id="consent" name="개인정보 수집 동의" value="동의함" required />
          <label for="consent">
            문의 응대를 위해 입력하신 이름, 회사명, 이메일, 연락처를 수집하는 데 동의합니다.
            수집한 정보는 답변 목적으로만 사용하며 처리 완료 후 파기합니다.
          </label>
        </div>

        <button class="submit-button" id="submitButton" type="submit">📩 문의 보내기</button>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>

    </section>
  </main>

  <script>
    const form = document.getElementById("contactForm");
    const submitButton = document.getElementById("submitButton");
    const status = document.getElementById("status");
    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");
    const themeLabel = document.getElementById("themeLabel");

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;

      const isDark = theme === "dark";
      themeIcon.textContent = isDark ? "🌙" : "☀️";
      themeLabel.textContent = isDark ? "다크 모드" : "라이트 모드";
      themeToggle.setAttribute("aria-pressed", String(isDark));
      themeToggle.setAttribute("aria-label", isDark ? "라이트 모드로 전환" : "다크 모드로 전환");

      try {
        localStorage.setItem("theme", theme);
      } catch (error) {
        // 저장할 수 없어도 화면 전환은 그대로 동작한다.
      }
    }

    function showStatus(message, kind) {
      status.textContent = message;
      status.className = `status show ${kind}`;
    }

    themeToggle.addEventListener("click", () => {
      applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      submitButton.disabled = true;
      submitButton.textContent = "보내는 중...";
      status.className = "status";

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: { Accept: "application/json" }
        });

        if (response.ok) {
          form.reset();
          showStatus("문의를 보냈습니다. 영업일 기준 2~3일 안에 답변드리겠습니다.", "success");
        } else {
          // Formspree는 검증 실패 시 { errors: [{ message }] } 형태로 응답한다.
          const data = await response.json().catch(() => null);
          const reason = data && Array.isArray(data.errors)
            ? data.errors.map((error) => error.message).join(" ")
            : "잠시 후 다시 시도해주세요.";

          showStatus(`문의를 보내지 못했습니다. ${reason}`, "error");
        }
      } catch (error) {
        showStatus("네트워크 오류로 문의를 보내지 못했습니다. 연결 상태를 확인한 뒤 다시 시도해주세요.", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "📩 문의 보내기";
      }
    });

    applyTheme(document.documentElement.dataset.theme || "dark");
  </script>
</body>
</html>
