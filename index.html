<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="버튼을 눌러 로또 번호를 무작위로 추천받는 웹사이트" />
  <title>행운의 로또 번호 추천</title>
  <style>
    :root {
      --bg-start: #10172a;
      --bg-end: #251447;
      --card: rgba(255, 255, 255, 0.1);
      --card-border: rgba(255, 255, 255, 0.16);
      --text: #ffffff;
      --subtext: #cfd4e4;
      --primary: #ffd166;
      --primary-dark: #f5b942;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 209, 102, 0.14), transparent 24%),
        radial-gradient(circle at 85% 80%, rgba(106, 95, 255, 0.22), transparent 26%),
        linear-gradient(145deg, var(--bg-start), var(--bg-end));
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    .background-shape {
      position: fixed;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.28;
      pointer-events: none;
      animation: float 7s ease-in-out infinite;
    }

    .shape-one {
      width: 170px;
      height: 170px;
      top: 8%;
      left: 8%;
      background: #ffd166;
    }

    .shape-two {
      width: 220px;
      height: 220px;
      right: 6%;
      bottom: 8%;
      background: #7c6cff;
      animation-delay: -2.5s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(7deg); }
    }

    .container {
      width: min(100%, 720px);
      position: relative;
      z-index: 1;
    }

    .lotto-card {
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      color: #fff4c8;
      background: rgba(255, 255, 255, 0.07);
      font-size: 0.88rem;
      font-weight: 800;
    }

    .sparkle { color: var(--primary); }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 4.4rem);
      line-height: 1.08;
      letter-spacing: -0.055em;
    }

    .description {
      max-width: 540px;
      margin: 18px auto 0;
      color: var(--subtext);
      font-size: 1rem;
      line-height: 1.75;
      word-break: keep-all;
    }

    .number-area {
      min-height: 126px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 38px 0 30px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: rgba(8, 11, 28, 0.26);
    }

    .numbers {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 13px;
    }

    .ball {
      width: clamp(54px, 11vw, 68px);
      height: clamp(54px, 11vw, 68px);
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      font-size: clamp(1.15rem, 4vw, 1.45rem);
      font-weight: 900;
      box-shadow: inset 0 -5px 12px rgba(0, 0, 0, 0.16), 0 10px 18px rgba(0, 0, 0, 0.2);
      transform: scale(0);
      animation: pop 0.42s cubic-bezier(.2, .85, .32, 1.35) forwards;
    }

    @keyframes pop { to { transform: scale(1); } }

    .placeholder {
      color: rgba(255, 255, 255, 0.58);
      font-weight: 700;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
    }

    button {
      min-height: 54px;
      border: 0;
      border-radius: 16px;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); }

    .generate-button {
      padding: 0 24px;
      color: #2e2100;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 15px 30px rgba(245, 185, 66, 0.24);
    }

    .copy-button {
      min-width: 106px;
      padding: 0 18px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
    }

    .copy-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .notice {
      margin: 20px 0 0;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.82rem;
    }

    .history {
      margin-top: 18px;
      padding: 22px;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(14px);
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .history h2 {
      margin: 0;
      font-size: 1.02rem;
      letter-spacing: -0.025em;
    }

    .clear-button {
      min-height: auto;
      padding: 7px 10px;
      color: var(--subtext);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: transparent;
      font-size: 0.78rem;
    }

    .history-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 13px;
      color: var(--subtext);
      background: rgba(3, 6, 18, 0.23);
      font-size: 0.9rem;
    }

    .history-number {
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .history-empty {
      padding: 10px 0 2px;
      color: rgba(255, 255, 255, 0.44);
      text-align: center;
      font-size: 0.86rem;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 10;
      padding: 12px 17px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      color: #fff;
      background: rgba(8, 10, 23, 0.9);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      opacity: 0;
      transform: translate(-50%, 18px);
      pointer-events: none;
      transition: 0.25s ease;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 520px) {
      body { padding: 14px; }
      .lotto-card { border-radius: 25px; }
      .number-area { padding: 20px 13px; }
      .numbers { gap: 9px; }
      .controls { grid-template-columns: 1fr; }
      .copy-button { width: 100%; }
      .history-item {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="background-shape shape-one"></div>
  <div class="background-shape shape-two"></div>

  <main class="container">
    <section class="lotto-card">
      <div class="badge">
        <span class="sparkle">✦</span>
        LOTTO NUMBER PICKER
      </div>

      <h1>오늘의 행운 번호</h1>

      <p class="description">
        버튼을 누르면 1부터 45까지의 숫자 중<br />
        중복 없이 6개를 무작위로 추천해드려요.
      </p>

      <div class="number-area" aria-live="polite">
        <div class="numbers" id="numbers">
          <span class="placeholder">버튼을 눌러 번호를 뽑아보세요.</span>
        </div>
      </div>

      <div class="controls">
        <button class="generate-button" id="generateButton" type="button">
          🍀 행운 번호 추천받기
        </button>

        <button class="copy-button" id="copyButton" type="button" disabled>
          번호 복사
        </button>
      </div>

      <p class="notice">
        모든 번호는 동일한 확률로 무작위 생성되며, 당첨을 보장하지 않습니다.
      </p>
    </section>

    <section class="history">
      <div class="history-header">
        <h2>최근 추천 번호</h2>
        <button class="clear-button" id="clearButton" type="button">기록 지우기</button>
      </div>

      <ul class="history-list" id="historyList">
        <li class="history-empty">아직 추천 기록이 없습니다.</li>
      </ul>
    </section>
  </main>

  <div class="toast" id="toast" role="status">번호를 복사했습니다.</div>

  <script>
    const numbersContainer = document.getElementById("numbers");
    const generateButton = document.getElementById("generateButton");
    const copyButton = document.getElementById("copyButton");
    const clearButton = document.getElementById("clearButton");
    const historyList = document.getElementById("historyList");
    const toast = document.getElementById("toast");

    let currentNumbers = [];
    let history = [];

    function createLottoNumbers() {
      const numberPool = Array.from({ length: 45 }, (_, index) => index + 1);

      for (let i = numberPool.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));
        [numberPool[i], numberPool[randomIndex]] = [numberPool[randomIndex], numberPool[i]];
      }

      return numberPool.slice(0, 6).sort((a, b) => a - b);
    }

    function getBallColor(number) {
      if (number <= 10) return "#f3b61f";
      if (number <= 20) return "#4d95e8";
      if (number <= 30) return "#ed6262";
      if (number <= 40) return "#7d8189";
      return "#48a76a";
    }

    function renderNumbers(numbers) {
      numbersContainer.innerHTML = "";

      numbers.forEach((number, index) => {
        const ball = document.createElement("span");
        ball.className = "ball";
        ball.textContent = number;
        ball.style.background = getBallColor(number);
        ball.style.animationDelay = `${index * 70}ms`;
        ball.setAttribute("aria-label", `${number}번`);
        numbersContainer.appendChild(ball);
      });
    }

    function renderHistory() {
      historyList.innerHTML = "";

      if (history.length === 0) {
        const empty = document.createElement("li");
        empty.className = "history-empty";
        empty.textContent = "아직 추천 기록이 없습니다.";
        historyList.appendChild(empty);
        return;
      }

      history.forEach((numbers, index) => {
        const item = document.createElement("li");
        item.className = "history-item";

        const label = document.createElement("span");
        label.textContent = `${index + 1}번째 추천`;

        const numberText = document.createElement("span");
        numberText.className = "history-number";
        numberText.textContent = numbers.join(" · ");

        item.append(label, numberText);
        historyList.appendChild(item);
      });
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {
        toast.classList.remove("show");
      }, 1800);
    }

    generateButton.addEventListener("click", () => {
      currentNumbers = createLottoNumbers();
      renderNumbers(currentNumbers);

      history.unshift(currentNumbers);
      history = history.slice(0, 5);
      renderHistory();

      copyButton.disabled = false;
      generateButton.textContent = "🎲 다시 추천받기";
    });

    copyButton.addEventListener("click", async () => {
      if (currentNumbers.length === 0) return;

      const text = currentNumbers.join(", ");

      try {
        await navigator.clipboard.writeText(text);
        showToast("번호를 복사했습니다.");
      } catch (error) {
        const temporaryInput = document.createElement("textarea");
        temporaryInput.value = text;
        document.body.appendChild(temporaryInput);
        temporaryInput.select();
        document.execCommand("copy");
        temporaryInput.remove();
        showToast("번호를 복사했습니다.");
      }
    });

    clearButton.addEventListener("click", () => {
      history = [];
      renderHistory();
      showToast("추천 기록을 지웠습니다.");
    });
  </script>
</body>
</html>
